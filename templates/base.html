<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AniManga World{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --anime-accent: #ff2e63;
            --anime-dark: #1a1a2e;
            --anime-card-bg: #16213e;
        }

        body {
            background-color: var(--anime-dark);
            color: #e2e2e2;
            font-family: 'Poppins', sans-serif;
        }

        .anime-navbar {
            background: rgba(22, 33, 62, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--anime-accent);
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.6rem;
            color: #fff !important;
        }

        .navbar-brand span {
            color: var(--anime-accent);
        }

        .anime-card {
            background: var(--anime-card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .anime-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(255, 46, 99, 0.3);
            border-color: var(--anime-accent);
        }

        .badge-rating {
            background: linear-gradient(45deg, #ff9f43, #ff5252);
            color: #fff;
            font-weight: 600;
        }

        .btn-anime {
            background: linear-gradient(45deg, var(--anime-accent), #ff5252);
            color: #fff;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(255, 46, 99, 0.4);
        }

        .btn-anime:hover {
            background: linear-gradient(45deg, #ff5252, var(--anime-accent));
            color: #fff;
        }

        .hero-banner {
            background: linear-gradient(135deg, rgba(255, 46, 99, 0.2), rgba(8, 217, 214, 0.1));
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 20px;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark anime-navbar sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fa-solid fa-fire-flame-curved me-2 text-danger"></i>ANI<span>MANGA</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="/"><i class="fa-solid fa-house me-1"></i> Нүүр</a></li>
                </ul>
                <div class="d-flex align-items-center">
                    {% if user.is_authenticated %}
                        <span class="me-3 text-light"><i class="fa-solid fa-user-ninja me-1 text-info"></i> {{ user.username }}</span>
                        <a href="/admin/" class="btn btn-outline-light btn-sm me-2">Admin</a>
                    {% else %}
                        <a href="/admin/login/" class="btn btn-anime btn-sm me-2"><i class="fa-solid fa-right-to-bracket me-1"></i> Нэвтрэх</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content (ЗӨВХӨН НЭГ УДАА БАЙХ ЁСТОЙ) -->
    <div class="container pb-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 border-top border-secondary text-muted mt-auto" style="background: #0f0f1b;">
        <p class="mb-0">© 2026 AniManga World. Бүх эрх хуулиар хамгаалагдсан.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
